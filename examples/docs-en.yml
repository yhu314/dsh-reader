# Example: a documentation folder read as one continuous book, English export.
# This is optional — with no `libraries` config at all, any opened markdown
# folder already works as a book with annotations in `<folder>/.dsh_reader/`.
- id: dsh_reader
  name: dsh_reader
  config:
    libraries:
      - id: handbook
        title: Handbook
        root: '/absolute/path/to/handbook/docs'
        annotationDir: '/absolute/path/to/handbook/annotations'
        recursive: true
        exclude: ['^drafts/']
    annotation:
      locale: en
    pathBase: '/absolute/path/to/handbook'
    promptTemplate: 'Revise {chapterFile} according to the annotations in {annotationFile}. Handle every item and report the outcome for each.'
